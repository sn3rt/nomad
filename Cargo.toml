[package]
name = "nomad-env"
version = "0.1.0"
edition = "2021"
description = "Temporary remote shells carrying your dotfiles over SSH"
publish = false

[lib]
name = "nomad_env"
path = "src/lib.rs"

[[bin]]
name = "nomad"
path = "src/bin/nomad.rs"

[dependencies]
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
